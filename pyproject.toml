[project]
name = "cton"
version = "1.0.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "astral==3.2",
    "fastapi==0.141.1",
    "httpx2==2.12.0",
    "psycopg[binary]==3.3.4",
    "pydantic==2.13.4",
    "python-dotenv==1.2.3",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["backend/tests"]

[tool.vercel]
entrypoint = "backend.main:app"
